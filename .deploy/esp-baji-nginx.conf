server {
  listen 80;
  listen [::]:80;
  server_name 60.205.122.153;

  client_max_body_size 300m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8787;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name 60.205.122.153;

  ssl_certificate /opt/ssl/idealink.top/idealink.top.pem;
  ssl_certificate_key /opt/ssl/idealink.top/idealink.top-20260528191148.key;
  ssl_trusted_certificate /opt/ssl/idealink.top/intermediate.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 300m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8787;
  }
}
